[package]
name = "rpi-health-mqtt"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "MIT"
description = "A lightweight Raspberry Pi health monitor that publishes metrics over MQTT"
publish = false

[dependencies]
clap = { version = "=4.6.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
rumqttc = { version = "=0.25.1", default-features = false }
secrecy = { version = "=0.10.3", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.20"
time = { version = "=0.3.47", default-features = false, features = ["formatting", "parsing", "std"] }
tokio = { version = "=1.48.0", default-features = false, features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
toml = { version = "=1.1.4", default-features = false, features = ["parse", "serde", "std"] }
tracing = { version = "=0.1.41", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.20", default-features = false, features = ["ansi", "env-filter", "fmt"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.2", default-features = false, features = ["fs", "process", "std"] }

[lib]
name = "rpi_health_mqtt"
path = "src/lib.rs"

[[bin]]
name = "rpi-health-mqtt"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
