[package]
name = "rpi-health-mqtt"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "MIT"
description = "A lightweight Raspberry Pi health monitor that publishes metrics over MQTT"
publish = false

[lib]
name = "rpi_health_mqtt"
path = "src/lib.rs"

[[bin]]
name = "rpi-health-mqtt"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
