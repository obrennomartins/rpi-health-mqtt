name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: Release validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Run the complete validation gate
        run: |
          bash scripts/validate-delivery.sh
          bash scripts/validate-ci.sh

  package:
    name: Build release assets
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Verify release metadata
        id: metadata
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="$(bash scripts/verify-release-tag.sh \
              "${GITHUB_REF_NAME}" \
              --main-ref refs/remotes/origin/main)"
          else
            version="$(bash scripts/verify-release-tag.sh)"
          fi

          source_date_epoch="$(git show -s --format=%ct HEAD)"
          [[ "${source_date_epoch}" =~ ^[0-9]+$ ]]

          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'source-date-epoch=%s\n' "${source_date_epoch}" >> "${GITHUB_OUTPUT}"

      - name: Test release helpers
        run: |
          bash tests/release/run.sh
          docker run --rm \
            --mount "type=bind,source=${PWD},target=/repo,readonly" \
            --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      - name: Build deterministic ARMv7 archive
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.source-date-epoch }}
        run: |
          mkdir -p .local dist
          : > .local/docker-ca.cer
          docker buildx build \
            --file docker/release.Dockerfile \
            --target export \
            --platform linux/amd64 \
            --secret id=host_ca,src=.local/docker-ca.cer \
            --build-arg "CACHE_REVISION=$(sha256sum .local/docker-ca.cer | awk '{print $1}')" \
            --build-arg "VERSION=${RELEASE_VERSION}" \
            --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" \
            --output type=local,dest=dist \
            .

      - name: Prepare the SBOM input
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          archive="dist/rpi-health-mqtt-${RELEASE_VERSION}-armv7-unknown-linux-gnueabihf.tar.gz"
          test -s "${archive}"
          bash scripts/verify-release-archive.sh "${archive}" "${RELEASE_VERSION}"
          mkdir -p sbom-input/release
          cp Cargo.lock Cargo.toml sbom-input/
          tar -xzf "${archive}" -C sbom-input/release

      - name: Download and verify Syft
        shell: bash
        run: |
          version=1.42.3
          archive="syft_${version}_linux_amd64.tar.gz"
          url="https://github.com/anchore/syft/releases/download/v${version}/${archive}"
          expected_sha256=0d6be741479eddd2c8644a288990c04f3df0d609bbc1599a005532a9dff63509

          mkdir -p .local/syft
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output ".local/${archive}" \
            "${url}"
          printf '%s  %s\n' "${expected_sha256}" ".local/${archive}" \
            | sha256sum --check --strict
          tar -xzf ".local/${archive}" -C .local/syft syft
          test "$(SYFT_CHECK_FOR_APP_UPDATE=false .local/syft/syft version -o json \
            | jq -r .version)" = "${version}"

      - name: Generate a reproducible SPDX SBOM
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.source-date-epoch }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          archive="dist/rpi-health-mqtt-${RELEASE_VERSION}-armv7-unknown-linux-gnueabihf.tar.gz"
          sbom="dist/rpi-health-mqtt-${RELEASE_VERSION}-armv7-unknown-linux-gnueabihf.spdx.json"

          bash scripts/generate-release-sbom.sh \
            .local/syft/syft \
            "${archive}" \
            "${RELEASE_VERSION}" \
            "${SOURCE_DATE_EPOCH}" \
            sbom-input \
            "${sbom}" \
            "${RELEASE_REPOSITORY}"
          bash scripts/generate-release-sbom.sh \
            .local/syft/syft \
            "${archive}" \
            "${RELEASE_VERSION}" \
            "${SOURCE_DATE_EPOCH}" \
            sbom-input \
            .local/reproducibility-check.spdx.json \
            "${RELEASE_REPOSITORY}"
          cmp "${sbom}" .local/reproducibility-check.spdx.json

      - name: Write and verify checksums
        run: |
          (
            cd dist
            sha256sum -- ./*.tar.gz ./*.spdx.json > SHA256SUMS
            sha256sum --check SHA256SUMS
            sha256sum --check ./*.tar.gz.sha256
          )

      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ steps.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  attest:
    name: Attest release assets
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ needs.package.outputs.version }}
          path: dist

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Attest the software bill of materials
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/rpi-health-mqtt-${{ needs.package.outputs.version }}-armv7-unknown-linux-gnueabihf.spdx.json

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [package, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ needs.package.outputs.version }}
          path: dist

      - name: Create the release from the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        shell: bash
        run: |
          release_flags=()
          precedence_version="${RELEASE_VERSION%%+*}"
          if [[ "${precedence_version}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" ./dist/* \
            --repo "${GH_REPO}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            "${release_flags[@]}"
